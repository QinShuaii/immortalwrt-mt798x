name: Build EX5700 NoWiFi
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential acpica-tools clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig uuid-dev \
            zlib1g-dev unzip lib32z1-dev ccache libelf-dev

      - name: Install feeds
        run: |
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp defconfig/mt7986-ax7800.config .config
          chmod +x scripts/config
          # 1) 物理删除闭源 WiFi 包（不存在 = 不可能复活）
          rm -rf package/mtk/drivers/mt_wifi \
                 package/mtk/drivers/warp \
                 package/mtk/drivers/conninfra \
                 package/mtk/drivers/wifi-profile \
                 package/mtk/applications/mtwifi-cfg \
                 package/mtk/applications/luci-app-mtwifi-cfg
          rm -rf package/feeds/luci/applications/luci-app-mtwifi* 2>/dev/null || true
          # 2) 清掉 .config 里所有 WiFi/wpad 残留行
          sed -i -E '/^#? *CONFIG_.*(MT_WIFI|WARP|CONNINFRA|MTK_WIFI|wifi|WIFI|wpad|hostapd|WIRELESS|wireless).*$/d' .config
          # 3) 只编 EX5700 一个机型（注意符号名：TARGET_DEVICE_ 开头！）
          sed -i '/^CONFIG_TARGET_DEVICE/d' .config
          sh ./scripts/config --enable TARGET_DEVICE_mediatek_mt7986_DEVICE_zyxel_ex5700
          # 4) 有线加速 + PPPoE 拨号
          sh ./scripts/config --enable MTK_WHNAT_SUPPORT \
            --enable PACKAGE_kmod-mediatek_hnat \
            --enable PACKAGE_ppp --enable PACKAGE_ppp-mod-pppoe \
            --enable PACKAGE_luci-proto-ppp
          make defconfig
          echo "===== 最终检查 ====="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_zyxel_ex5700=y' .config \
            || { echo "EX5700 机型未选中，中止"; exit 1; }
          if grep -iE '^CONFIG_.*(mt_wifi|warp|conninfra|mtwifi|wifi-dats).*=[ym]$' .config; then
            echo "WiFi 残留，中止"; exit 1
          else
            echo "OK: 固件中无任何 WiFi 组件"
          fi
          grep -E 'CONFIG_MTK_WHNAT_SUPPORT=y|CONFIG_PACKAGE_kmod-mediatek_hnat=y|CONFIG_PACKAGE_ppp-mod-pppoe=y' .config \
            || { echo "有线加速/PPPoE 未启用，中止"; exit 1; }
          grep -E '^CONFIG_PACKAGE_luci-base=y' .config \
            || { echo "LuCI 未启用（feeds 没装好），中止"; exit 1; }

      - name: Build
        run: |
          make -j$(($(nproc)-1)) || make -j1 V=s
          mkdir -p out
          find bin/targets/mediatek/mt7986 -name "*zyxel_ex5700*" -exec cp {} out/ \;
          cp .config out/.config.used
          [ "$(ls -A out | grep -v config.used)" ] \
            || { echo "编译完成但未产出 EX5700 镜像！实际产物如下："; find bin/targets -name "*.bin" | head -50; exit 1; }

      - name: Dump config on failure
        if: failure()
        run: |
          mkdir -p dbg
          cp .config dbg/.config.failed 2>/dev/null || true
          grep -iE '^CONFIG_.*(mt_wifi|warp|conninfra|mtwifi|wifi).*=[ym]$' .config > dbg/wifi-leftover.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ (job.status == 'failure') && 'configure-debug' || 'openwrt-ex5700-nowifi' }}
          path: ${{ (job.status == 'failure') && 'dbg/' || 'out/' }}
